<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts from Google Fonts - Autour One and Inter -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Autour+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!-- CSS Link -->
     <link rel="stylesheet" href="css/main.css">
     
    <title>Our Menu Page</title>
</head>
<body>
    <!-- HEADER
     LOGO + HAMBURGUER + LINE SECTION DIVIDER 
     -->
    <!-- Organazing the Header Menu for Mobile First wich is a Hamburguer Menu Icon to open the dropdown to the menu for mvoile, the icon I did on Figma as SVG as well the x-button to close the hambuguer -->
    <header class="site-header"> <!-- This is the class for the whole header -->
        <!-- For this section and probably for the footer I just copied and pasted from my index.html because the header and the footer are the same in all pages. As I said, I copied and pasted from my index.html so the code for this section is the same and the comments as well. The new comments is gonna appear at some point while I'm developing the body of the site -->

        <!-- DROPDOWN MENU - HAMBURGUER AND X -->
         <input type="checkbox" id="dropdown-box" class="dropdown-checkbox">

        <!-- Div for the top of the header of the page, when it is logo and the hamburguer icon -->
        <div class="header-top">
            <!-- LOGO -->
             <a href="index.html" class="logo">
                <img src="assets/images/logo-plantpalette.png" alt="Plant Palette Green Logo">
             </a>

            <!-- Hamburguer ICON - for the mobile's menu -->
              <label for="dropdown-box" class="dropdown-open">
                <img src="assets/icons/hamburguer-menu-icon.svg" alt="Hamburguer Icon to open the mobile's menu">
              </label>
        </div>

            <!-- MENU MOBILE -->
             <nav class="mobile-nav">
                <!-- X ICON to close the dropdown that I opened using the hamburguer -->
                 <label for="dropdown-box" class="dropdown-close">
                    <img src="assets/icons/x-button.svg" alt="X Button to close the dropdown menu">
                 </label>

                 <!-- List for the Navigation Menu properly -->
                  <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="menu.html">Our Menu</a></li>
                    <li><a href="catering-events.html">Catering & Events</a></li>
                    <li><a href="#">Contact</a></li>
                    <!-- Pages that I put # it is pages that I have in the Menu but they're not designed. The other ones, I linked to their own page. -->
                  </ul>
             </nav>
    </header>

    <!-- HERO SECTION - just an image -->
     <section class="menu-hero">
        <img src="assets/images/hero-menu.jpg" alt="A colourful bowl of salad, vegetables and an egg surrounded by juice and some sauce." class="menu-hero-image">
     </section>

     <!-- MENU SECTION - TITLES -->
      <section class="menu-section">
        <!-- The first h2 center in the page "bowls" -->
         <h2 class="menu-subtitle">BOWLS</h2>
         <h1 class="menu-title">BOWLS</h1>

         <!-- Div for the icons and the close caption for them in a row -->
          <div class="menu-icons-row">
            <!-- 1ST LINE -->
            <!-- VEGAN ICON -->
            <div class="menu-icons-line">
                <div class="menu-icon-item">
                    <img src="assets/icons/vegan-icon.svg" alt="A green circle with a leave inside for the Vegan Icon for dietary indicator">
                    <p class="menu-icon-label">(V) Vegan</p>
                </div>
            <!-- SPICY ICON -->
                <div class="menu-icon-item">
                    <img src="assets/icons/spicy-icon.svg" alt="An orange circle with a pepper inside for the Spicy Icon for dietary indicator">
                    <p class="menu-icon-label">(SP) Spicy</p>
                </div>
            </div>

            <!-- 2ND LINE -->
            <!-- GLUTEN FREE ICON -->
             <div class="menu-icons-line">
                <div class="menu-icon-item2">
                    <img src="assets/icons/gf-icon.svg" alt="A beige circle with a wheat inside for the Gluten Free Icon for dietary indicator">
                    <p class="menu-icon-label">(GF) Gluten-free</p>
            </div>
            <!-- NUT FREE ICON -->
             <div class="menu-icon-item2">
                <img src="assets/icons/nf-icon.svg" alt="A beige circle with a peanut inside for the Nut Free Icon for dietary indicator">
                <p class="menu-icon-label">(NF) Nut-free</p>
            </div>
            </div>
          </div>
      </section>
</body>
</html>
