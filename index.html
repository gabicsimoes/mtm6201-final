<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts from Google Fonts - Autour One and Inter -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Autour+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!-- CSS Link -->
     <link rel="stylesheet" href="css/main.css">

    <title>Home Page</title>
</head>
<body>
    <!-- Organazing the Header Menu for Mobile First wich is a Hamburguer Menu Icon to open the dropdown to the menu for mvoile, the icon I did on Figma as SVG as well the x-button to close the hambuguer -->
    <header class="site-header"> <!-- This is the class for the whole header -->
        <!-- I didn't know how to create the dropdown for my hamburguer menu, so I asked AI and I was insecure because she said to use a checkbox, and then I search on Google other options using details and summary and other one using buttons and a href. I didn't know any either, and I tried the checkbox before and worked exatcly in the way that I wanted, so I keep it.
        What I understand was: it is a box to check something, but on CSS I'll gonna hide the checkbox to do not click on a box, and I gonna label the hamburguer to click and show the dropdown box, and label the "x" to close the dropdown, and I'll style the colour, corners, etc to look like more similar to mine.
        I'm not trying many things this time, what works for me in the way that I want, and if I am understanding the process, I will keep, I hope I would be safe. -->

        <!-- DROPDOWN MENU - HAMBURGUER AND X -->
         <input type="checkbox" id="dropdown-box" class="dropdown-checkbox">

        <!-- Div for the top of the header of the page, when it is logo and the hamburguer icon -->
        <div class="header-top">
            <!-- LOGO -->
             <a href="index.html" class="logo">
                <img src="assets/images/logo-plantpalette.png" alt="Plant Palette Green Logo">
             </a>

            <!-- Hamburguer ICON - for the mobile's menu -->
              <label for="dropdown-box" class="dropdown-open">
                <img src="assets/icons/hamburguer-menu-icon.svg" alt="Hamburguer Icon to open the mobile's menu">
              </label>
        </div>

            <!-- MENU MOBILE -->
             <nav class="mobile-nav">
                <!-- X ICON to close the dropdown that I opened using the hamburguer -->
                 <label for="dropdown-box" class="dropdown-close">
                    <img src="assets/icons/x-button.svg" alt="X Button to close the dropdown menu">
                 </label>

                 <!-- List for the Navigation Menu properly -->
                  <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="menu.html">Our Menu</a></li>
                    <li><a href="catering-events.html">Catering & Events</a></li>
                    <li><a href="#">Contact</a></li>
                    <!-- Pages that I put # it is pages that I have in the Menu but they're not designed. The other ones, I linked to their own page. -->
                  </ul>
             </nav>
    </header>
</body>
</html>
